<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Mania — modo clássico</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="tela-jogo">

    <header class="hud">
        <p class="hud-modo">Modo clássico</p>

        <p class="hud-item">
            <span class="hud-rotulo">Pontuação</span>
            <output id="pontuacao">0</output>
        </p>

        <p class="hud-item">
            <span class="hud-rotulo">Vidas</span>
            <output id="vidas">♥ ♥ ♥</output>
        </p>
    </header>

    <main class="arena">

        <section class="palco">
            <img id="residuo" class="residuo"
                 src="assets/residuos/garrafa-pet.png"
                 alt="Garrafa PET de refrigerante" draggable="true">
            <p class="residuo-nome" id="residuo-nome">Garrafa PET de refrigerante</p>
        </section>

        <p class="feedback" id="feedback" role="status" aria-live="polite">
            Arraste o resíduo até a lixeira certa, ou clique nela.
        </p>

        <section class="lixeiras" id="lixeiras">

            <button class="lixeira" data-tipo="vidro">
                <img src="assets/lixeiras/vidro.png" alt="Lixeira de vidro">
                <span class="lixeira-nome">Vidro</span>
            </button>

            <button class="lixeira" data-tipo="plastico">
                <img src="assets/lixeiras/plastico.png" alt="Lixeira de plástico">
                <span class="lixeira-nome">Plástico</span>
            </button>

            <button class="lixeira" data-tipo="papel">
                <img src="assets/lixeiras/papel.png" alt="Lixeira de papel">
                <span class="lixeira-nome">Papel</span>
            </button>

            <button class="lixeira" data-tipo="organico">
                <img src="assets/lixeiras/organico.png" alt="Lixeira de orgânico">
                <span class="lixeira-nome">Orgânico</span>
            </button>

            <button class="lixeira" data-tipo="metal">
                <img src="assets/lixeiras/metal.png" alt="Lixeira de metal">
                <span class="lixeira-nome">Metal</span>
            </button>

        </section>

    </main>

    <footer class="rodape">
        <a class="botao botao-discreto" href="index.html">Voltar ao menu</a>
    </footer>

</body>
</html>
