<!DOCTYPE html>
<html>
  	<head>
    	<meta charset="utf8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<meta title="MENU FINAL">
    	<link rel="stylesheet" href="style.css">
  	</head>

  	<body>
    	<header>
    		<title>PONTUAÇÃO FINAL</title>
    	</header>

    	<section id="tela final" class="modo clássico">
      		<h2>Modo clássico</h2>
      		<p>
				Quantidade de vidas restantes <output id="vidas_classico">0</output>
      			<br>
      			Quantidade de acertos: <output id="acertos_classico">0</output>
      			<br>
      			Quantidade de acertos consecutivos <output id="consecutivos">0</output>
      			<br>
      			Quantidade de erros<output id="erros_classico">0</output>
      		</p>
    	</section>

    	<section id="tela final" class="modo por tempo">
      		<h2>Modo por tempo</h2>
      		<p>
				Quantidade de acertos <output id="acertos_tempo">0</output>
      			<br>
      			Quantidade de acertos consecutivos <output id="consecutivos_tempo">0</output>
      			<br>
      			Quantidade de erros <output id="erros_tempo">0</output>
      		</p>
    	</section>

    	<a href="index.html">
      		<button>Retornar ao menu</button>
    	</a> 
  	</body>
</html>
